<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <title>Последната глогинка</title>
  <base href="/">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <link rel="stylesheet" type="text/css" href="css/files.css" />
  <script src="script.js" type="text/javascript"></script>
</head>

<body>
  <div id="page-wrapper">
    <include-html src="/layout/prebar.html"></include-html>
    <include-html src="/layout/header.html"></include-html>
    <div class="container">
      <include-html src="/layout/sidebar.html"></include-html>

      <main class="bordered">
        <include-html src="/layout/topbar.html"></include-html>

        <div class="sectionHeader">
          <span class="headerImg"></span>
          <h2>Файлове</h2>
        </div>

        <div id="password-gate" class="password-gate">
          <p class="gate-hint">Тайните на Глогинка</p>
          <hr>
          <p class="gate-error" id="gateError"></p>
          <p class="gate-msg">За достъп до тази страница ви е необходима парола от собственика на сайта</p>
          <p class="gate-msg">Паролата е gloginka</p>
          <div class="gate-form">
            <label for="passwordInput">Парола:</label>
            <input type="password" id="passwordInput" onkeydown="if(event.key==='Enter') unlock()">
            <button onclick="unlock()">log in</button>
          </div>
        </div>

        <div id="file-list" class="file-list" style="display:none;">

          <div class="file-entry">
            <div class="file-icon">📄</div>
            <div class="file-info">
              <div class="file-name">secrets.txt</div>
              <div class="file-meta">1 KB &nbsp;·&nbsp; 2006</div>
              <pre class="file-content" id="fileContent"></pre>
              <div class="file-download" id="fileDownload">
                <a href="files/secrets.txt" download>⬇ Изтегли secrets.txt</a>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
    <include-html src="/layout/footer.html"></include-html>
  </div>
  <include-html src="/layout/filler.html"></include-html>

  <script>
    async function unlock() {
      const input = document.getElementById('passwordInput').value.trim().toLowerCase();
      const error = document.getElementById('gateError');

      if (input === 'gloginka') {
        document.getElementById('password-gate').style.display = 'none';
        document.getElementById('file-list').style.display = 'block';
        try {
          const res = await fetch('files/secrets.txt');
          const text = await res.text();
          const content = document.getElementById('fileContent');
          content.textContent = text;
          content.style.display = 'block';
          document.getElementById('fileDownload').style.display = 'block';
        } catch {
          document.getElementById('fileDownload').style.display = 'block';
        }
      } else {
        error.textContent = 'Грешна парола. :( Опитай пак!';
      }
    }
  </script>
</body>

</html>
