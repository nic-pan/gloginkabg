<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Последната глогинка - Галерия</title>
    <base href="/">
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/gallery.css" />
    <script src="script.js"></script>
    <script src="gallery/gallery-data.js"></script>
</head>

<body>
    <div id="page-wrapper">
        <include-html src="/layout/prebar.html"></include-html>
    <include-html src="/layout/header.html"></include-html>
        <div class="container">
            <include-html src="/layout/sidebar.html"></include-html>

            <main class="bordered">
                <include-html src="/layout/topbar.html"></include-html>
                <div class="sectionHeader">
                    <span class="headerImg"></span>
                    <h2>Галерия</h2>
                </div>
                <div id="gallery-view"></div>
            </main>
        </div>
        <include-html src="/layout/footer.html"></include-html>
    </div>
    <include-html src="/layout/adbox.html"></include-html>

    <script>
        const params = new URLSearchParams(location.search);
        const cat = params.get('cat');
        const id = parseInt(params.get('id'), 10);

        const view = document.getElementById('gallery-view');

        if (!cat || isNaN(id)) {
            location.replace('/gallery/');
        }

        const category = (typeof galleryData !== 'undefined') ? galleryData[cat] : null;
        const item = category ? category.items[id] : null;

        if (!item) {
            view.innerHTML = '<p style="padding:12px">Снимката не е намерена. <a href="/gallery/">← Галерия</a></p>';
        } else {
            // Like dir.bg: "Category" « Предишна  Следваща » above one framed photo.
            // The photo opens in full size in a new tab.
            const prev = id > 0
                ? `<a href="gallery/item.html?cat=${cat}&id=${id - 1}">&laquo; Предишна</a>`
                : '';
            const next = id < category.items.length - 1
                ? `<a href="gallery/item.html?cat=${cat}&id=${id + 1}">Следваща &raquo;</a>`
                : '';

            view.innerHTML = `
                <div class="gallery-nav">
                    <a href="gallery/"><b>"${category.label}"</b></a>
                    ${prev}
                    ${next}
                </div>
                <div class="gallery-full">
                    <a href="${item.src}" target="_blank" rel="noopener"><img src="${item.src}" alt="${item.title}"></a>
                    <p class="gallery-photo-title">${item.title}</p>
                </div>`;
        }
    </script>
</body>

</html>
