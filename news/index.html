<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Последната глогинка</title>
    <base href="/">
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/news.css" />
    <script src="../script.js" type="text/javascript"></script>
</head>

<body>
    <div id="page-wrapper">
        <include-html src="/layout/prebar.html"></include-html>
    <include-html src="/layout/header.html"></include-html>
        <div class="container">
            <include-html src="/layout/sidebar.html"></include-html>

            <main class="news">
                <include-html src="/layout/topbar.html"></include-html>
                <div class="sectionHeader">
                    <span class="headerImg"></span>
                    <h2>Новини</h2>
                </div>

                <div id="news-container">
                </div>
            </main>
        </div>
        <include-html src="/layout/footer.html"></include-html>
    </div>
    <include-html src="/layout/adbox.html"></include-html>

    <script>

        function renderNewsGroups(data) {
            const container = document.getElementById('news-container');

            data.forEach(group => {
                const section = document.createElement('section');
                section.classList.add('news-group');

                // Group title
                section.innerHTML += `
                    <h3 class="news-group-title">
                        <a href="${group.titleUrl}" class="underlined">${group.title}</a>
                    </h3>
            `;

                // News items list
                const ul = document.createElement('ul');
                ul.classList.add('news-list');

                group.items.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="news-item-row">
                            <span class="news-date">${item.date}</span>
                            <a class="news-title" href="${item.url}">${item.title}</a>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                section.appendChild(ul);

                container.appendChild(section);
                const hr = document.createElement('hr');
                hr.classList.add('news-divider');
                container.appendChild(hr);
            });
        }

        const newsGroups = [
            {
                title: "Категория",
                titleUrl: "news/cat.html",
                items: [
                    {
                        date: "25 Май 25",
                        title: 'Новина',
                        url: "news/news.html"
                    }
                ]
            }
        ];
        renderNewsGroups(newsGroups)

    </script>
</body>

</html>
