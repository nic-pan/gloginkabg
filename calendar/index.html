<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <title>Последната глогинка</title>
  <base href="/">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script src="script.js" type="text/javascript"></script>
</head>

<body>
  <div id="page-wrapper">
    <include-html src="/layout/prebar.html"></include-html>
    <include-html src="/layout/header.html"></include-html>
    <div class="container">
      <include-html src="/layout/sidebar.html"></include-html>

      <main class="bordered">
        <include-html src="/layout/topbar.html"></include-html>

        <div class="sectionHeader">
          <span class="headerImg"></span>
          <h2>Календар</h2>
        </div>

        <div class="centered" style="padding: 1rem;">
          <div id="calendar-main"></div>
        </div>
      </main>
    </div>
    <include-html src="/layout/footer.html"></include-html>
  </div>
  <include-html src="/layout/adbox.html"></include-html>

  <script>
    let calMonth = new Date().getMonth();
    let calYear  = new Date().getFullYear();

    function renderMainCalendar(month, year) {
      const today = new Date();
      const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;
      const monthNames = ["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
      const dayNames   = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

      const firstDay   = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startDay   = firstDay === 0 ? 6 : firstDay - 1;

      let html = `<table class="centered"><thead>
        <tr class="month">
          <th colspan="7">
            <button onclick="changeMainMonth(-1)" style="float:left;">←</button>
            ${monthNames[month]} ${year}
            <button onclick="changeMainMonth(1)" style="float:right;">→</button>
          </th>
        </tr>
        <tr class="weekdays">`;
      for (const d of dayNames) html += `<th>${d}</th>`;
      html += `</tr></thead><tbody><tr>`;

      for (let i = 0; i < startDay; i++) html += `<td></td>`;

      let day = 1;
      for (let i = startDay; i < 7; i++) {
        const isToday = isCurrentMonth && day === today.getDate();
        html += `<td class="${isToday ? 'today' : ''}">${day++}</td>`;
      }
      html += `</tr>`;

      while (day <= daysInMonth) {
        html += `<tr>`;
        for (let i = 0; i < 7; i++) {
          if (day <= daysInMonth) {
            const isToday = isCurrentMonth && day === today.getDate();
            html += `<td class="${isToday ? 'today' : ''}">${day++}</td>`;
          } else {
            html += `<td></td>`;
          }
        }
        html += `</tr>`;
      }

      html += `</tbody></table>`;
      document.getElementById('calendar-main').innerHTML = html;
    }

    function changeMainMonth(offset) {
      calMonth += offset;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      else if (calMonth < 0) { calMonth = 11; calYear--; }
      renderMainCalendar(calMonth, calYear);
    }

    document.addEventListener('DOMContentLoaded', () => renderMainCalendar(calMonth, calYear));
  </script>
</body>

</html>
